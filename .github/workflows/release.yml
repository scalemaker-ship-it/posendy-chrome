# 태그 하나로 깃허브 릴리스까지 끝낸다. npm 레지스트리에는 발행하지 않는다.
#
# 설치는 install.ps1 / install.sh 가 릴리스 에셋에서 직접 받는다:
#   posendy-chrome-bridge-<v>.tgz  -> npm install -g <릴리스 URL>
#   posendy-chrome-shared-<v>.tgz  -> 브리지 package.json 의 의존성을 이 릴리스 URL 로 바꿔 둔다
#   posendy-chrome-extension.zip   -> 압축해제된 확장 프로그램으로 로드
# 릴리스를 만든 뒤 windows-install-test 를 호출해 윈도우에서 실제 설치까지 검증한다.
name: release

on:
  push:
    tags:
      - 'v*'
  # 수동 실행 = 리허설. 빌드·테스트·팩·가드까지 다 돌리고 **발행과 릴리스는 건너뛴다**.
  # 태그를 밀기 전에 파이프라인이 성한지 확인하는 용도다.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub 릴리스 생성
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # 태그 실행이면 태그와 package.json 이 어긋난 채로 발행되는 사고를 막고,
      # 수동 실행(dry run)이면 package.json 버전을 그대로 쓴다.
      - name: Resolve and verify version
        run: |
          PKG_VERSION=$(node -p "require('./packages/shared/package.json').version")
          BRIDGE_VERSION=$(node -p "require('./app/native-server/package.json').version")
          if [ "$PKG_VERSION" != "$BRIDGE_VERSION" ]; then
            echo "::error::shared($PKG_VERSION) 와 bridge($BRIDGE_VERSION) 버전이 다릅니다"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::package.json 은 $PKG_VERSION 인데 태그는 $TAG_VERSION 입니다"
              exit 1
            fi
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "검증 통과: $PKG_VERSION"

      # 스크립트를 켠 채로 설치한다. sharp 0.32 는 install 스크립트로 prebuilt 바이너리를
      # 받아오는데, --ignore-scripts 로 막으면 테스트 10개 파일이 로드조차 못 한다
      # (`Cannot find module '../build/Release/sharp-linux-x64.node'`).
      # bridge 의 postinstall 은 `dist/scripts/postinstall.js` 가 있을 때만 도는데 이 시점엔
      # dist 를 아직 빌드하지 않았으므로 no-op 이다 — CI 러너에 네이티브 호스트를 등록하지 않는다.
      - run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build

      - name: Jest regression
        working-directory: app/native-server
        run: npx jest --colors

      - name: Vitest regression
        working-directory: app/chrome-extension
        run: npx vitest run

      # 에셋 이름 두 가지가 **모두** 필요하다:
      #   - install.ps1 은 릴리스 에셋에서 `*chrome.zip` 패턴으로 찾는다
      #   - bridge 의 postinstall 은 releases/latest/download/posendy-chrome-extension.zip 고정명으로 받는다
      - name: Package extension zips
        run: |
          cd app/chrome-extension/.output/chrome-mv3
          zip -qr "${{ github.workspace }}/posendy-chrome-extension-${VERSION}-chrome.zip" .
          cp "${{ github.workspace }}/posendy-chrome-extension-${VERSION}-chrome.zip" \
             "${{ github.workspace }}/posendy-chrome-extension.zip"

      - name: Package launcher tarball
        run: |
          tar czf "chrome-launcher-v${VERSION}.tar.gz" \
            -C packages/chrome-launcher \
            bin dist package.json README.md

      # 브리지의 shared 의존성을 npm 레지스트리 대신 이 릴리스의 tgz URL 로 고정한다.
      # (posendy-chrome-shared 는 npm 에 발행하지 않는다)
      - name: Point bridge -> shared dependency at release asset
        run: |
          SHARED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/posendy-chrome-shared-${VERSION}.tgz"
          node -e '
            const fs = require("fs");
            const p = "app/native-server/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.dependencies["posendy-chrome-shared"] = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log("shared ->", process.argv[1]);
          ' "$SHARED_URL"

      - name: Pack tarballs
        run: |
          mkdir -p dist-tarballs
          pnpm --filter posendy-chrome-shared pack --pack-destination "$PWD/dist-tarballs"
          pnpm --filter posendy-chrome-bridge pack --pack-destination "$PWD/dist-tarballs"
          ls -la dist-tarballs
          tar -xzOf "dist-tarballs/posendy-chrome-bridge-${VERSION}.tgz" package/package.json \
            | node -e '
              let d = "";
              process.stdin.on("data", (c) => (d += c)).on("end", () => {
                const dep = JSON.parse(d).dependencies["posendy-chrome-shared"];
                if (!String(dep).startsWith("https://")) {
                  console.error("::error::shared 의존성이 릴리스 URL 이 아닙니다: " + dep);
                  process.exit(1);
                }
                console.log("bridge -> shared:", dep);
              });'
          tar -tzf "dist-tarballs/posendy-chrome-bridge-${VERSION}.tgz" | grep -q "package/dist/run_host.bat" \
            || { echo "::error::브리지 tgz 에 run_host.bat 이 없습니다"; exit 1; }

      - name: GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            posendy-chrome-extension-${{ env.VERSION }}-chrome.zip
            posendy-chrome-extension.zip
            chrome-launcher-v${{ env.VERSION }}.tar.gz
            dist-tarballs/posendy-chrome-bridge-${{ env.VERSION }}.tgz
            dist-tarballs/posendy-chrome-shared-${{ env.VERSION }}.tgz
            install.ps1
            install.sh

  windows-install-test:
    needs: release
    if: github.event_name == 'push'
    uses: ./.github/workflows/windows-install-test.yml
    with:
      version: ${{ github.ref_name }}
